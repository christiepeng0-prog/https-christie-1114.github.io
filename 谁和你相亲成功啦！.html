<style>
:root{
  --bg:#F6F3EE; --card:#FFFFFF; --ink:#23211F; --sub:#6B655E;
  --line:#E7E1D8; --accent:#9C5660;
  --hot:#B7576B; --safe:#5E9B7E; --fun:#D99A3D; --alone:#5B76B8;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  line-height:1.6; font-size:15px;
}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;padding:24px 20px 40px;display:flex;flex-direction:column}
.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
.view{display:none;flex-direction:column;flex:1;animation:fade .35s ease}
.view.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 首页 */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:10px 0}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--sub)}
h1.title{font-size:30px;line-height:1.35;font-weight:700;letter-spacing:.02em}
h1.title em{font-style:normal;color:var(--accent)}
.lead{color:var(--sub);font-size:15px}
.choice-label{font-size:13px;color:var(--sub);margin-top:8px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.choice-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;cursor:pointer;text-align:center;transition:border-color .2s,transform .2s}
.choice-card .big{font-size:17px;font-weight:600;margin-bottom:4px}
.choice-card .small{font-size:12.5px;color:var(--sub)}
.choice-card.sel{border-color:var(--accent);background:#FBF3F4}
.btn{display:block;width:100%;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;padding:15px 18px;cursor:pointer;letter-spacing:.05em}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--sub);text-align:center}

/* 答题 */
.quiz-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:14px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:26px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.q-text{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .2s,background .2s}
.opt .key{flex:0 0 26px;height:26px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub)}
.opt .ot{font-size:15px}
.opt.sel{border-color:var(--accent);background:#FBF3F4}
.opt.sel .key{background:var(--accent);color:#fff;border-color:var(--accent)}
.quiz-foot{margin-top:24px;display:flex;gap:12px}
.quiz-foot .btn{flex:1}

/* 加载 */
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.loading .ring{width:44px;height:44px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 结果 */
.result-head{text-align:center;margin:6px 0 20px}
.result-head .tag{display:inline-block;font-size:12.5px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:4px 12px;margin-bottom:12px}
.type-name{font-size:24px;font-weight:700}
.type-desc{color:var(--sub);font-size:14px;margin-top:8px}
.bars{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
.bar-row{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:10px;padding:7px 0}
.bar-row .bn{font-size:13px}
.bar-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:99px}
.bar-row .bv{font-size:12px;color:var(--sub);text-align:right}
.match-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center;margin-bottom:18px}
.match-card .role{font-size:26px;font-weight:700;margin:8px 0 4px}
.match-card .drama{font-size:13px;color:var(--sub)}
.match-card .fit{display:inline-block;margin-top:10px;font-size:14px;color:var(--accent);font-weight:600}
.match-card .rtag{margin-top:12px;font-size:14px;color:var(--ink);background:var(--bg);border-radius:12px;padding:12px 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.panel h3{font-size:14px;margin-bottom:8px}
.panel p{font-size:14px;color:var(--sub)}
.foot-btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.disclaimer{font-size:11.5px;color:var(--sub);text-align:center;margin-top:20px;line-height:1.7}
</style>
</head>

<div class="wrap">

  <!-- 首页 -->

  <section class="view" id="view-result">

      <div class="type-desc" id="r-type-desc"></div>
    </div>

    <div class="bars" id="r-bars"></div>

    <div class="match-card">
      <div class="eyebrow">命中灵魂恋人</div>
      <div class="role serif" id="r-role"></div>
      <div class="drama" id="r-drama"></div>
      <div class="fit" id="r-fit"></div>
      <div class="rtag" id="r-tag"></div>
    </div>

    <div class="panel">
      <h3>你们的相处日常</h3>
      <p id="r-daily"></p>
    </div>
    <div class="panel">
      <h3>婚后生活图景</h3>
      <p id="r-marriage"></p>
    </div>
    <div class="panel">
      <h3>感情小提醒</h3>
      <p id="r-remind"></p>
    </div>

    <div class="foot-btns">
      <button class="btn" id="btn-share">复制我的结果</button>
      <button class="btn ghost" id="btn-retry">重新测评</button>
    </div>
    <p class="disclaimer">本测评仅供趣味娱乐，人物均为影视剧虚构角色，与演员本人无关，不存在任何代言合作；结果不代表真实感情预测。</p>
  </section>

</div>

/* ===== 状态 ===== */
var state={gender:null,idx:0,answers:[]};

function $(id){return document.getElementById(id)}
function show(view){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$(view).classList.add("active")}

/* 性别选择 */
document.querySelectorAll("#gender-grid .choice-card").forEach(c=>{
  c.addEventListener("click",()=>{
    document.querySelectorAll("#gender-grid .choice-card").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel");
    state.gender=c.dataset.gender;
    $("btn-start").disabled=false;
  });
});

$("btn-start").addEventListener("click",()=>{
  if(!state.gender)return;
  state.idx=0;state.answers=[];
  renderQuiz();show("view-quiz");
});

function renderQuiz(){
  var q=QUESTIONS[state.idx];
  $("q-index").textContent=(state.idx+1)+" / "+QUESTIONS.length;
  var pct=Math.round(state.idx/QUESTIONS.length*100);
  $("q-bar").style.width=pct+"%";$("q-progress-text").textContent=pct+"%";
  $("q-text").textContent=q.t;
  var opts=$("q-opts");opts.innerHTML="";
  var keys=["A","B","C","D"];
  q.o.forEach(function(o,i){
    var div=document.createElement("div");
    div.className="opt"+(state.answers[state.idx]===o[1]?" sel":"");
    div.innerHTML='<div class="key">'+keys[i]+'</div><div class="ot">'+o[0]+'</div>';
    div.addEventListener("click",()=>{
      state.answers[state.idx]=o[1];
      if(state.idx<QUESTIONS.length-1){state.idx++;renderQuiz();}
      else{finish();}
    });
    opts.appendChild(div);
  });
  $("btn-back").style.visibility=state.idx===0?"hidden":"visible";
}

$("btn-back").addEventListener("click",()=>{
  if(state.idx>0){state.idx--;renderQuiz();}
});

function scoreAnswers(){
  var s={hot:0,safe:0,fun:0,alone:0};
  state.answers.forEach(a=>{if(a)s[a]++;});
  return s;
}

function finish(){
  show("view-loading");
  setTimeout(function(){
    var s=scoreAnswers();
    var main=TYPE_ORDER.slice().sort((a,b)=>s[b]-s[a])[0];
    var pool=ROLES[state.gender];
    var total=QUESTIONS.length;
    var best=null,bestFit=-1;
    pool.forEach(r=>{
      var fit=TYPE_ORDER.reduce((sum,k)=>sum+(s[k]/total)*r.w[k],0);
      if(r.type===main)fit+=3;
      if(fit>bestFit){bestFit=fit;best=r;}
    });
    renderResult(s,main,best,bestFit);
    show("view-result");
  },900);
}

function fitPercent(fit){
  var p=Math.round((fit/100)*100);
  p=Math.max(94,Math.min(99,p));
  return p+"%";
}

function renderResult(s,main,role,fit){
  var t=TYPES[main];
  $("r-type-name").textContent=t.name;
  $("r-type-desc").textContent=t.desc;

  var bars=$("r-bars");bars.innerHTML="";
  TYPE_ORDER.forEach(k=>{
    var row=document.createElement("div");row.className="bar-row";
    var pct=Math.round(s[k]/QUESTIONS.length*100);
    row.innerHTML='<div class="bn">'+TYPES[k].name.slice(0,4)+'</div>'+
      '<div class="bar-track"><i style="width:'+pct+'%;background:'+TYPES[k].color+'"></i></div>'+
      '<div class="bv">'+pct+'%</div>';
    bars.appendChild(row);
  });

  $("r-role").textContent=role.name;
  $("r-drama").textContent="出自《"+role.drama+"》";
  $("r-fit").textContent="契合度 "+fitPercent(fit);
  $("r-tag").textContent=role.tag;
  $("r-daily").textContent=t.daily;
  $("r-marriage").textContent=t.marriage;
  $("r-remind").textContent=t.remind;

  state.result={type:t.name,role:role.name,drama:role.drama,fit:fitPercent(fit)};
}

$("btn-share").addEventListener("click",function(){
  var r=state.result;if(!r)return;
  var txt="我测出的灵魂恋人是《"+r.drama+"》里的"+r.role+"，契合度"+r.fit+"，属于"+r.type+"。快来测测谁和你相亲成功啦！";
  function fallback(){
    var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);
    ta.select();try{document.execCommand("copy");alert("结果已复制，去粘贴分享吧");}catch(e){alert("复制失败，请手动截图分享");}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert("结果已复制，去粘贴分享吧")).catch(fallback);
  }else{fallback();}
});

$("btn-retry").addEventListener("click",()=>{
  state.gender=null;state.idx=0;state.answers=[];state.result=null;
  document.querySelectorAll("#gender-grid .choice-card").forEach(x=>x.classList.remove("sel"));
  $("btn-start").disabled=true;
  show("view-home");
});
</script>
